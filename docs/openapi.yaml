  "components": {
    "securitySchemes": {
      "ApplicationAssertion": {
        "type": "http",
        "scheme": "bearer",
        "bearerFormat": "Ed25519 JWS",
        "description": "sf-assertion+jwt; required audience, identity, method/path/body/idempotency binding."
      }
    },
    "schemas": {
      "ErrorEnvelope": {
        "type": "object",
        "properties": {
          "error": {
            "type": "object",
            "properties": {
              "code": {
                "type": "string"
              },
              "message": {
                "type": "string"
              },
              "retry_after": {
                "type": "integer",
                "minimum": 1
              }
            },
            "additionalProperties": false,
            "required": [
              "code",
              "message"
            ]
          }
        },
        "additionalProperties": false,
        "required": [
          "error"
        ]
      },
      "OK": {
        "type": "object",
        "properties": {
          "ok": {
            "type": "boolean"
          }
        },
        "additionalProperties": false,
        "required": [
          "ok"
        ]
      },
      "Proof": {
        "type": "object",
        "properties": {
          "token": {
            "type": "string"
          },
          "purpose": {
            "type": "string",
            "enum": [
              "access",
              "sensitive",
              "replacement"
            ]
          },
          "expires_at": {
            "type": "string",
            "format": "date-time"
          }
        },
        "additionalProperties": false,
        "required": [
          "token",
          "purpose",
          "expires_at"
        ]
      },
      "Verification": {
        "type": "object",
        "properties": {
          "access": {
            "$ref": "#/components/schemas/Proof"
          },
          "sensitive": {
            "$ref": "#/components/schemas/Proof"
          }
        },
        "additionalProperties": false,
        "required": [
          "access",
          "sensitive"
        ]
      },
      "Enrollment": {
        "type": "object",
        "properties": {
          "secret": {
            "type": "string"
          },
          "uri": {
            "type": "string",
            "description": "Sensitive otpauth URI; never log."
          },
          "expires_at": {
            "type": "string",
            "format": "date-time"
          }
        },
        "additionalProperties": false,
        "required": [
          "secret",
          "uri",
          "expires_at"
        ]
      },
      "Codes": {
        "type": "object",
        "properties": {
          "recovery_codes": {
            "type": "array",
            "minItems": 10,
            "maxItems": 10,
            "items": {
              "type": "string"
            }
          }
        },
        "additionalProperties": false,
        "required": [
          "recovery_codes"
        ]
      },
      "Confirmation": {
        "type": "object",
        "properties": {
          "recovery_codes": {
            "type": "array",
            "minItems": 10,
            "maxItems": 10,
            "items": {
              "type": "string"
            }
          },
          "verification": {
            "$ref": "#/components/schemas/Verification"
          }
        },
        "additionalProperties": false,
        "required": [
          "recovery_codes",
          "verification"
        ]
      },
      "Status": {
        "type": "object",
        "properties": {
          "enrolled": {
            "type": "boolean"
          },
          "recovery_pending": {
            "type": "boolean"
          },
          "remaining_recovery_codes": {
            "type": "integer",
            "minimum": 0
          },
          "version": {
            "type": "integer",
            "minimum": 1
          }
        },
        "additionalProperties": false,
        "required": [
          "enrolled",
          "recovery_pending",
          "remaining_recovery_codes",
          "version"
        ]
      },
      "RecoveryJob": {
        "type": "object",
        "properties": {
          "job_id": {
            "type": "string"
          },
          "state": {
            "type": "string",
            "enum": [
              "blocked",
              "invited",
              "replacing",
              "completed",
              "cancelled"
            ]
          }
        },
        "additionalProperties": false,
        "required": [
          "job_id",
          "state"
        ]
      },
      "Event": {
        "type": "object",
        "properties": {
          "id": {
            "type": "string"
          },
          "subject": {
            "type": "string"
          },
          "kind": {
            "type": "string"
          },
          "payload": {
            "type": "object",
            "additionalProperties": true
          },
          "delivery": {
            "type": "object",
            "additionalProperties": true,
            "description": "Privileged sensitive notification material; never log."
          },
          "lease": {
            "type": "string"
          },
          "created_at": {
            "type": "string",
            "format": "date-time"
          }
        },
        "additionalProperties": false,
        "required": [
          "id",
          "subject",
          "kind",
          "payload",
          "lease",
          "created_at"
        ]
      }
    }
  }
}
