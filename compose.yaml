services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: secondfactor
      POSTGRES_DB: secondfactor
      POSTGRES_PASSWORD_FILE: /run/secrets/database-password
    volumes:
      - database:/var/lib/postgresql/data
      - ./secrets/database-password:/run/secrets/database-password:ro
    ports: ["127.0.0.1:15433:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U secondfactor -d secondfactor"]
      interval: 3s
      timeout: 2s
      retries: 20
    networks: [secondfactor]
  migrate:
    build: .
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    command: ["migrate", "--config", "/app/config.json"]
    volumes:
      - ./config.compose.json:/app/config.json:ro
      - ./secrets:/app/secrets:ro
    depends_on:
      postgres: {condition: service_healthy}
    networks: [secondfactor]
  api:
    build: .
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    volumes:
      - ./config.compose.json:/app/config.json:ro
      - ./secrets:/app/secrets:ro
    ports: ["127.0.0.1:8443:8443"]
    depends_on:
      migrate: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD-SHELL", "test -r /app/secrets/dev.crt && pidof secondfactor"]
      interval: 5s
      timeout: 2s
      retries: 10
    networks: [secondfactor]
  demo:
    build: .
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    entrypoint: ["secondfactor-demo"]
    command: ["--service", "https://api:8443"]
    volumes:
      - ./secrets:/app/secrets:ro
    ports: ["127.0.0.1:9443:9443"]
    depends_on:
      api: {condition: service_started}
    networks: [secondfactor]
volumes:
  database:
networks:
  secondfactor:
    ipam:
      config: [{subnet: 172.29.87.0/24}]
